# Three-Brain AI Orchestrator — Docker Compose
# Runs on Oracle VM. LLMs run on Kaggle via FRP tunnel.
#
# Usage:
#   docker compose up -d
#
# Environment variables set in .env file (copy from .env.example)

version: '3.8'

services:
  # ============================================================
  # ORCHESTRATOR — Three-Brain API Server (Port 8005)
  # ============================================================
  orchestrator:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    container_name: three-brain-orchestrator
    restart: unless-stopped
    ports:
      - "8005:8005"
    environment:
      # Model endpoints (via FRP tunnel on Oracle localhost)
      - MINISTRAL_BASE_URL=http://127.0.0.1:7001/v1
      - DEEPSEEK_BASE_URL=http://127.0.0.1:7002/v1
      # OpenRouter (set in .env or Coolify UI)
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - STRATEGIST_MODEL=openrouter/nemotron-3-ultra-free
      # Model names (as served by llama.cpp on Kaggle)
      - MINISTRAL_MODEL=mistral-7b-instruct-v0.1.Q4_K_M
      - DEEPSEEK_MODEL=deepseek-coder-7b-instruct-v1.5.Q4_K_M
      # Temperatures
      - BUILDER_TEMP=0.3
      - ANALYST_TEMP=0.2
      - STRATEGIST_TEMP=0.1
      # Context windows
      - MINISTRAL_CTX=4096
      - DEEPSEEK_CTX=4096
      - STRATEGIST_CTX=200000
      # Max completion tokens
      - MINISTRAL_MAX_TOKENS=2048
      - DEEPSEEK_MAX_TOKENS=2048
      - STRATEGIST_MAX_TOKENS=8192
      # Safety
      - REQUIRE_APPROVAL=true
      - BLOCKED_PATHS=.env,*.key,*.pem,secrets/,credentials/
      - PROTECTED_FILES=risk_engine.py,position_sizing.py,order_execution.py,broker.py
      # Directories
      - TASKS_DIR=/app/tasks
      - MEMORY_DIR=/app/memory
      - LOGS_DIR=/app/logs
    volumes:
      - ./tasks:/app/tasks
      - ./memory:/app/memory
      - ./logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================
  # OPTIONAL: JetBrains Air (if running on Oracle)
  # ============================================================
  # jetbrains-air:
  #   image: jetbrains/air:latest
  #   container_name: three-brain-air
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   volumes:
  #     - ./projects:/home/user/projects
  #   environment:
  #     - AIR_LICENSE=${AIR_LICENSE}

volumes:
  tasks:
  memory:
  logs:

networks:
  default:
    name: three-brain-network